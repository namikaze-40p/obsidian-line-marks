name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

# `contents` is required to create a release and upload files. Set here so that it does not depend on the repository default (read-only).
# `id-token` and `attestations` are required to attest the build provenance of the files.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      # Lets users verify that the released files were built from this repository by this workflow (`gh attestation verify`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
