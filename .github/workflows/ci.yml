name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Read access is enough.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Tests run .ts files directly with Node's type stripping, which is enabled by default in Node 22.18 or later.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Includes type checking (tsc).
      - name: Build
        run: npm run build
